services:
  - type: web
    name: gautex-web
    runtime: node
    plan: free
    branch: main
    buildCommand: NODE_ENV=development npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://www.gautex.com
      - key: NEXT_PUBLIC_GA_ID
        value: G-V86Q4399E2
      - key: CONTACT_EMAIL
        value: info@gautex.com
      - key: REPLY_TO_EMAIL
        value: info@gautex.com
      - key: EXTRA_ALLOWED_ORIGINS
        value: https://gautex-web.onrender.com
      - key: EMAIL_TRANSPORT
        value: smtp
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Gautex Medica <info@gautex.com>
      - key: SMTP_HOST
        value: smtp.serviciodecorreo.es
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@gautex.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Gautex Medica <info@gautex.com>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: live

  - type: web
    name: gautex-web-staging
    runtime: node
    plan: free
    branch: staging
    buildCommand: NODE_ENV=development npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://gautex-web-staging-dcib.onrender.com
      - key: NEXT_PUBLIC_GA_ID
        value: G-V86Q4399E2
      - key: NEXT_PUBLIC_GA_DEBUG
        value: "true"
      - key: CONTACT_EMAIL
        value: gautexmedica@gmail.com
      - key: REPLY_TO_EMAIL
        value: info@gautex.com
      - key: EXTRA_ALLOWED_ORIGINS
        value: https://gautex-web-staging.onrender.com
      - key: EMAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Gautex Medica <info@gautex.com>
      - key: SMTP_HOST
        value: smtp.serviciodecorreo.es
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@gautex.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Gautex Medica <info@gautex.com>
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MODE
        value: sandbox
